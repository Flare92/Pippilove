name: Pubblica PippiLove

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pubblica
  cancel-in-progress: true

jobs:
  # Database + funzione Selene su Supabase (salta da solo se i segreti non ci sono ancora)
  backend:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER }}
      AI_MODEL: ${{ vars.AI_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - name: Controllo configurazione
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Mancano SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD o SUPABASE_PROJECT_REF: salto Supabase (vedi README)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ok == 'true'
        with:
          version: latest

      - name: Database
        if: steps.cfg.outputs.ok == 'true'
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Chiave AI
        if: steps.cfg.outputs.ok == 'true'
        run: |
          if [ -z "$AI_API_KEY" ]; then
            echo "::warning::Manca il segreto AI_API_KEY: Selene non potrà rispondere finché non lo aggiungi."
            exit 0
          fi
          args=("AI_API_KEY=$AI_API_KEY" "AI_PROVIDER=${AI_PROVIDER:-groq}")
          if [ -n "$AI_MODEL" ]; then args+=("AI_MODEL=$AI_MODEL"); fi
          supabase secrets set "${args[@]}" --project-ref "$PROJECT_REF"

      - name: Funzione Selene
        if: steps.cfg.outputs.ok == 'true'
        run: supabase functions deploy selene --project-ref "$PROJECT_REF" --no-verify-jwt

  # L'app (PWA) su GitHub Pages
  sito:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepara il sito
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf "export const SUPABASE_URL = '%s';\nexport const SUPABASE_ANON_KEY = '%s';\n" "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > js/config.js
          else
            echo "::notice::SUPABASE_URL / SUPABASE_ANON_KEY non impostate: l'app li chiederà al primo avvio."
          fi
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
